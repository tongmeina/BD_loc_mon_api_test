# Windows GBK 控制台下日志含 emoji 可能 UnicodeEncodeError，请先设 PYTHONUTF8=1 与 PYTHONIOENCODING=utf-8。
# 说明见同目录 WINDOWS_PYTEST_UTF8.md
[pytest]
addopts = -vs
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .venv __pycache__ .pytest_cache unit
log_cli = true
log_cli_level = INFO
log_cli_format = [%(levelname)s] %(message)s