intercom_close_cases:
  # 顺序硬约束：路人必须在群主正向之前（失败才不毁主链）；重复关闭必须在群主正向之后
  - name: "对讲群-关闭-负向-非群主-路人"
    scene: not_owner_stranger
    intercomGroupId: "{{ig_group_id}}"
    expect_status: 1
    expected:
      code: 999
      error_msg: "只有群主可以查看详情"

  - name: "对讲群-关闭-正向-群主"
    intercomGroupId: "{{ig_group_id}}"
    expect_status: 0
    expected:
      code: 0
      msg: "成功"

  - name: "对讲群-关闭-负向-假群id"
    intercomGroupId: "0"
    expected:
      code: 3003
      error_msg: "群聊不存在"

  - name: "对讲群-关闭-负向-无Token"
    intercomGroupId: "0"
    no_auth: true
    expected:
      code: 3001
      error_msg: "没有访问权限"

  - name: "对讲群-关闭-负向-重复关闭"
    scene: already_closed
    intercomGroupId: "{{ig_group_id}}"
    expect_status: 0
    expected:
      code: 1001
      error_msg: "群聊已结束，无法操作"

  - name: "对讲群-关闭-负向-非群主-被邀请人"
    scene: not_owner_invitee
    expect_status: 1
    expected:
      code: 999
      error_msg: "只有群主可以查看详情"

